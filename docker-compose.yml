services:
  # PostgreSQL + PostGIS (timetable, stations, spatial queries)
  db:
    image: postgis/postgis:16-3.4
    container_name: margdarshak-db
    environment:
      POSTGRES_DB: margdarshak
      POSTGRES_USER: margdarshak
      POSTGRES_PASSWORD: changeme_in_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margdarshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (route caching, live delay store)
  redis:
    image: redis:7-alpine
    container_name: margdarshak-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend
  api:
    build: .
    container_name: margdarshak-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

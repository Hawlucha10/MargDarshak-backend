apiVersion: apps/v1
kind: Deployment
metadata:
  name: margdarshak-api
  namespace: default
  labels:
    app: margdarshak-api
    tier: backend
spec:
  replicas: 2  # Baseline minimum replicas
  selector:
    matchLabels:
      app: margdarshak-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployment
  template:
    metadata:
      labels:
        app: margdarshak-api
        tier: backend
    spec:
      containers:
        - name: api
          image: margdarshak/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: margdarshak-config
            - secretRef:
                name: margdarshak-secrets
          resources:
            requests:
              cpu: "500m"      # 0.5 CPU core minimum
              memory: "1Gi"     # 1 GB RAM minimum
            limits:
              cpu: "2000m"     # 2 CPU cores maximum per pod
              memory: "4Gi"     # 4 GB RAM maximum per pod
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: margdarshak-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: margdarshak-api
  minReplicas: 2   # Low-traffic baseline (e.g. 3:00 AM)
  maxReplicas: 50  # High-traffic surge peak (e.g. 8:00 AM rush / 1M users)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15  # Fast scale-up on sudden rush
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cool-down to prevent flapping
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
